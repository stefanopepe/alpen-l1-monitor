name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NETWORK: mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  postgres:
    runs-on: ubuntu-latest
    env:
      NETWORK: mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - name: Verify SQL, fencing and races through transaction-mode PgBouncer
        run: TEST_DATABASE_URL=postgres://monitor_owner@127.0.0.1:6432/monitor pnpm test test/database.test.ts
      - if: always()
        run: docker compose down -v
